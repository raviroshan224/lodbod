name: lodbod
description: "LODBOD Shipper: post loads, compare carrier bids and track shipments (assessment prototype)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  # Material widgets. Since Flutter 3.44 they live in this package rather than
  # flutter/material.dart; go_router 18 and Riverpod 3.5 already depend on it.
  material_ui: ^1.10.0
  flutter_riverpod: ^3.5.0 # State management
  go_router: ^18.1.3 # Navigation, auth redirect, tab shell
  firebase_core: ^5.1.0 # Firebase initialisation
  cloud_firestore: ^7.1.0 # Persistence, live streams, transactions
  firebase_auth: ^7.0.1 # Accounts, sessions, password reset
  url_launcher: ^6.3.3 # Call carrier / pickup contact
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory Firestore so repository transactions can be unit-tested.
  fake_cloud_firestore: ^4.5.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Inter (SIL Open Font License, see assets/fonts/OFL.txt), Latin subset.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
